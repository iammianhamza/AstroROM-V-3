name: Build ROM for y2q Device

on:
  workflow_dispatch:
    inputs: 
      device:
        description: 'Device codename'
        required: false
        default: 'y2q'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check initial disk space
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          echo "=========================="
          AVAILABLE_GB=$(df --output=avail / | tail -1 | awk '{print int($1/1024/1024)}')
          TOTAL_GB=$(df --output=size / | tail -1 | awk '{print int($1/1024/1024)}')
          USED_GB=$(df --output=used / | tail -1 | awk '{print int($1/1024/1024)}')
          echo "Total space: ${TOTAL_GB}GB"
          echo "Used space: ${USED_GB}GB"
          echo "Available space: ${AVAILABLE_GB}GB"
        
      - name: Free up disk space
        run: |
          echo "=== Freeing up disk space ==="
          
          # Remove unnecessary packages
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' '^php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          # Remove .NET SDK
          if [ -d "/usr/share/dotnet" ]; then
            echo "Removing .NET SDK..."
            sudo rm -rf /usr/share/dotnet
          fi
          
          # Remove Android SDK (only if not needed for ROM build)
          if [ -d "/usr/local/lib/android" ]; then
            echo "Removing Android SDK..."
            sudo rm -rf /usr/local/lib/android
          fi
          
          # Remove GHC Haskell compiler
          if [ -d "/opt/ghc" ]; then
            echo "Removing GHC..."
            sudo rm -rf /opt/ghc
          fi
          
          # Remove Boost libraries
          if [ -d "/usr/local/share/boost" ]; then
            echo "Removing Boost..."
            sudo rm -rf /usr/local/share/boost
          fi
          
          # Remove CodeQL
          if [ -d "/opt/hostedtoolcache/CodeQL" ]; then
            echo "Removing CodeQL..."
            sudo rm -rf /opt/hostedtoolcache/CodeQL
          fi
          
          # Remove Node modules
          if [ -d "/usr/local/lib/node_modules" ]; then
            echo "Removing Node modules..."
            sudo rm -rf /usr/local/lib/node_modules
          fi
          
          # Remove JVM
          if [ -d "/usr/lib/jvm" ]; then
            echo "Removing JVM..."
            sudo rm -rf /usr/lib/jvm
          fi
          
          # Remove Android SDK tools
          if [ -n "$AGENT_TOOLSDIRECTORY" ] && [ -d "$AGENT_TOOLSDIRECTORY" ]; then
            echo "Removing Android SDK tools..."
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi
          
          # Clean up Docker images and containers
          echo "Cleaning Docker..."
          docker system prune -af --volumes || true
          docker rmi $(docker image ls -aq) 2>/dev/null || true
          
          # Remove swap file
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          
          # Clean up apt cache and lists
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "=== Cleanup completed ==="
      
      - name: Verify disk space after cleanup
        run: |
          echo "=== Disk Space After Cleanup ==="
          df -h
          echo "================================"
          
          # Calculate space metrics
          INITIAL_AVAILABLE_GB=$(df --output=avail / | tail -1 | awk '{print int($1/1024/1024)}')
          TOTAL_GB=$(df --output=size / | tail -1 | awk '{print int($1/1024/1024)}')
          USED_GB=$(df --output=used / | tail -1 | awk '{print int($1/1024/1024)}')
          PERCENT_FREE=$(df --output=pcent / | tail -1 | tr -d ' %')
          
          echo "Total space: ${TOTAL_GB}GB"
          echo "Used space: ${USED_GB}GB"
          echo "Available space: ${INITIAL_AVAILABLE_GB}GB"
          echo "Percentage free: $((100 - PERCENT_FREE))%"
          
          # Note: We can't calculate space recovered without the initial value
          # But we show the current available space
          echo ""
          echo "=== Space Recovery Report ==="
          echo "Current available space: ${INITIAL_AVAILABLE_GB}GB"
          echo "Disk usage: ${PERCENT_FREE}%"
          echo "============================"
          
          if [ "$INITIAL_AVAILABLE_GB" -lt 10 ]; then
            echo "::warning::Low disk space after cleanup: ${INITIAL_AVAILABLE_GB}GB"
          fi
        
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget gnupg flex bison gperf build-essential \
            zip zlib1g-dev libc6-dev libncurses5-dev x11-utils \
            libx11-dev libreadline-dev libgl1-mesa-dev tofrodos \
            python-is-python3 libxml2-utils xsltproc rsync ccache git-lfs
            
      - name: Make build script executable
        run: chmod +x build.sh
      
      - name: Check disk space before build
        run: |
          echo "=== Disk Space Before Build ==="
          df -h
          echo "================================"
          AVAILABLE_GB=$(df --output=avail / | tail -1 | awk '{print int($1/1024/1024)}')
          echo "Available space for build: ${AVAILABLE_GB}GB"
          
          if [ "$AVAILABLE_GB" -lt 50 ]; then
            echo "::error::Insufficient disk space: ${AVAILABLE_GB}GB (minimum 50GB required for ROM builds)"
            exit 1
          elif [ "$AVAILABLE_GB" -lt 80 ]; then
            echo "::warning::Limited disk space: ${AVAILABLE_GB}GB (recommended 80GB+ for optimal ROM builds)"
          fi
          
      - name: Build ROM using build.sh
        run: ./build.sh --build "${{ github.event.inputs.device || 'y2q' }}"
        timeout-minutes: 480
        
      - name:  Collect build artifacts
        if: success()
        run: |
          BUILD_DATE=$(date +%Y%m%d_%H%M%S)
          mkdir -p rom_artifacts
          # Adjust path based on where your build. sh outputs files
          if [ -d out/ ]; then
            find out/ -name "*.zip" -type f -exec cp {} rom_artifacts/ \;
            echo "Build artifacts collected successfully"
          else
            echo "No ROM artifacts found"
            exit 1
          fi
          
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AstroROM-${{ github.event.inputs.device || 'y2q' }}-${{ github.run_id }}
          path: rom_artifacts/
          retention-days: 30
          
      - name: Build failed notification
        if: failure()
        run: |
          echo "❌ Build for ${{ github.event.inputs. device || 'y2q' }} device failed!"
          echo "Check the logs above for more details"
          exit 1
